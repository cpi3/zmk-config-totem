# --- Power Management & Sleep Settings ---

# Enable deep sleep support
CONFIG_ZMK_SLEEP=y

# Milliseconds of inactivity before entering deep sleep (600,000 ms = 10 minutes)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# Milliseconds of inactivity before entering low-power idle mode (30,000 ms = 30 seconds)
CONFIG_ZMK_IDLE_TIMEOUT=30000


# --- Battery Level Reporting Settings ---

# Enable battery level reporting over BLE
CONFIG_ZMK_BATTERY_REPORTING=y

# Report battery level for both split halves (percentage of peripheral battery sent to dongle)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y


# --- Hardware & Bluetooth Optimization ---

# Fix for XIAO BLE boards that lack an external 32kHz crystal oscillator
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Increase Bluetooth radio transmit power (+8 dBm) to improve connection stability between halves and dongle
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
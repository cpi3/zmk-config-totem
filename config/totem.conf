# --- Power Management & Deep Sleep ---
CONFIG_ZMK_SLEEP=y
# 10 minutes (600,000 ms) before deep sleep
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000 
CONFIG_ZMK_IDLE_TIMEOUT=30000

# --- Reconnection & Bluetooth Stability (Fixes Dongle Sleep Issue) ---

# Prevent loss of pairing bonds across restarts
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

# Disable Directed Advertising on peripherals
# (Forces halves to broadcast general reconnect signals that the dongle can catch upon wake-up)
CONFIG_BT_CTLR_PHY_2M=n

# Increase BLE Tx Power to max (+8 dBm) for better wake-up signal penetration
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Hardware Clock Stability Fix
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# --- Battery Reporting Settings ---
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
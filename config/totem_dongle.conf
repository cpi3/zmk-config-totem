# =====================================================================
# config/totem_dongle.conf
# Personal overrides for the "totem_dongle" shield ONLY.
# ZMK auto-loads this file because its name matches the shield name
# used in build.yaml. (Your old "totem.conf" didn't match any shield
# name, so it likely wasn't being applied to any build at all.)
# =====================================================================

# --- Power management: THIS IS THE ACTUAL FIX for your bug ---
# The dongle is plugged into USB power 24/7 and has zero keys of its
# own (it's built with a mock kscan), so it has no way to physically
# wake itself back up once it goes into deep sleep. That's exactly
# what was forcing you to unplug/replug it every time. A USB-powered
# dongle should simply never deep-sleep:
CONFIG_ZMK_SLEEP=n

CONFIG_ZMK_USB=y

# --- Bluetooth / bonding stability ---
# Keep paired bonds across reboots and reflashes.
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

# --- Battery reporting ---
# Lets the dongle fetch and relay the left/right halves' battery
# levels to your computer.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# NOTE: confirmed against the ghyatzo/zmk-totem-module source — the
# totem_dongle shield's own Kconfig.defconfig (inside its module's
# boards/shields/totem/ folder, which west pulls in automatically) already
# sets CONFIG_ZMK_SPLIT, CONFIG_ZMK_SPLIT_ROLE_CENTRAL, CONFIG_ZMK_USB,
# CONFIG_BT_MAX_CONN/PAIRED, AND CONFIG_ZMK_SLEEP=n. This file's CONFIG_ZMK_SLEEP=n
# is a deliberate, harmless duplicate — an explicit guarantee that survives
# even if the upstream module ever changes. Don't add the split/BT settings
# here too, they're already covered.

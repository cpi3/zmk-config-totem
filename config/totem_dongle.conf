# USB-powered split BLE central. It should remain awake.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_USB=y

# The XIAO board normally routes Zephyr console output to its own CDC ACM
# endpoint. The dongle keeps only the dedicated ZMK Studio CDC ACM endpoint,
# so the normal UART console must not be built against the disabled node.
CONFIG_UART_CONSOLE=n

CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

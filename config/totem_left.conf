# =====================================================================
# config/totem_left.conf
# Personal overrides for the "totem_left" shield ONLY.
# =====================================================================

# --- Power management ---
# This half runs on battery and has real keys, so a keypress wakes it
# straight back up — normal deep sleep is good here, unlike the dongle.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
# ^ 15 minutes of inactivity before deep sleep. Tune to taste.
CONFIG_ZMK_IDLE_TIMEOUT=30000
# ^ 30 seconds before "idle" (dims/turns off any LEDs, OLED, etc.)

# --- Bluetooth / bonding stability ---
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

# NOTE: CONFIG_ZMK_SPLIT / CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n should already
# be set by the totem_left shield's own Kconfig.defconfig. Leave that
# to the shield definition — this file is just your personal tweaks.
